<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Gallery | Tsukumo Tsuguhiro</title>
    <meta
      name="description"
      content="研究活動や人物像が伝わる写真をまとめたギャラリーページ。ポートレートを中心に、今後の研究記録も追加できる構成です。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,800&family=Space+Grotesk:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="gallery-page">
    <div class="noise"></div>
    <header class="hero page-hero">
      <nav class="nav">
        <a class="brand brand-link" href="index.html"><span class="name-en">Tsukumo Tsuguhiro</span> / 白 承容</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="index.html#research">Research</a>
          <a href="gallery.html" class="is-current">Gallery</a>
          <a href="index.html#contact" class="btn">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="section" id="gallery-slider">
        <div class="section-head" data-animate>
          <h2>Photos</h2>
        </div>

        <div class="gallery-slider" data-animate data-gallery-slider>
          <div class="gallery-frame card" data-gallery-frame>
            <img class="gallery-slide-image" data-gallery-image alt="" />
          </div>

          <div class="gallery-empty" data-gallery-empty hidden>
            <code>gallery-photos/</code> に画像が見つかりませんでした。
          </div>

          <div class="gallery-controls" data-gallery-controls>
            <button type="button" class="gallery-button" data-gallery-prev>Prev</button>
            <p class="gallery-status">
              <span data-gallery-index>0 / 0</span>
            </p>
            <button type="button" class="gallery-button" data-gallery-next>Next</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2024 <span class="name-en">Tsukumo Tsuguhiro</span> / 白 承容. Crafted with clarity and curiosity.</p>
      <a href="index.html">Back to portfolio</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
